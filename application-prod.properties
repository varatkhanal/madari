# ============================================================
# PRODUCTION CONFIG — used when SPRING_PROFILES_ACTIVE=prod
# All sensitive values come from Render environment variables
# ============================================================

server.port=${PORT:8080}

# --- Database (PostgreSQL on Render) ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false

# --- Security ---
jwt.secret=${JWT_SECRET}
jwt.expiration=360000000

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-frontend.onrender.com}

# --- Actuator (health check for Render) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Logging ---
logging.level.root=WARN
logging.level.com.vadin=INFO
